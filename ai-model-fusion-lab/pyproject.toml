[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-model-fusion-lab"
version = "0.1.0"
description = "Experimental laboratory: inspect, ablate, merge, distill and route multiple AI models into multi-specialist systems."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
real = ["torch>=2.0", "transformers>=4.40", "safetensors>=0.4", "huggingface_hub>=0.23"]

[tool.setuptools]
packages = ["models", "benchmarking", "ablation", "merging", "distillation",
            "adapters", "experts", "router", "licensing", "experiments", "app",
            "demo", "configs", "tests"]
